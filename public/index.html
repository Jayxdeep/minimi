<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>minimi — a chat agent that remembers</title>
    <style>
      :root {
        --bg: #0a0b0e;
        --panel: #101218;
        --panel-2: #151822;
        --line: #232838;
        --text: #e6e9f2;
        --muted: #8b93a7;
        --accent: #8aa4ff;
        --accent-soft: #1b2340;
        --danger: #ff8b8b;
        --radius: 14px;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }

      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(900px 500px at 50% -200px, #182036 0%, transparent 70%),
          var(--bg);
        color: var(--text);
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        width: 100%;
        max-width: 840px;
        margin: 0 auto;
        padding: 18px 20px 10px;
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-weight: 650;
        letter-spacing: -0.02em;
        font-size: 17px;
      }

      .brand small {
        color: var(--muted);
        font-weight: 400;
        font-size: 12px;
        letter-spacing: 0.02em;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }

      .pill {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 999px;
        padding: 4px 10px;
        white-space: nowrap;
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      #new-session {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 12px;
        color: var(--muted);
        transition: 120ms ease;
      }

      #new-session:hover { color: var(--text); border-color: #35405a; }

      main {
        flex: 1;
        overflow-y: auto;
        width: 100%;
        max-width: 840px;
        margin: 0 auto;
        padding: 8px 20px 24px;
        scrollbar-width: thin;
      }

      .empty {
        margin-top: 12vh;
        text-align: center;
        color: var(--muted);
      }

      .empty h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--text);
      }

      .empty p { margin: 6px 0; font-size: 14px; }
      .empty code { font-family: var(--mono); font-size: 12px; color: var(--accent); }

      .row {
        display: flex;
        margin: 18px 0;
        animation: rise 180ms ease-out;
      }

      .row.user { justify-content: flex-end; }

      @keyframes rise {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: none; }
      }

      .bubble {
        max-width: min(680px, 88%);
        padding: 11px 15px;
        border-radius: var(--radius);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .user .bubble {
        background: var(--accent-soft);
        border: 1px solid #2a3559;
      }

      .assistant .bubble {
        background: var(--panel);
        border: 1px solid var(--line);
      }

      .assistant .bubble.error {
        border-color: #4a2430;
        color: var(--danger);
      }

      .who {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 5px;
      }

      .status {
        margin-top: 8px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .status::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.1s ease-in-out infinite;
      }

      .status.quiet::before { display: none; }

      @keyframes pulse {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 1; }
      }

      .cursor {
        display: inline-block;
        width: 7px;
        height: 1.05em;
        margin-left: 2px;
        vertical-align: text-bottom;
        background: var(--accent);
        animation: blink 1s steps(2, start) infinite;
      }

      @keyframes blink { to { visibility: hidden; } }

      footer {
        width: 100%;
        max-width: 840px;
        margin: 0 auto;
        padding: 0 20px 18px;
      }

      form {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 10px 10px 10px 14px;
        transition: border-color 120ms ease;
      }

      form:focus-within { border-color: #34405f; }

      textarea {
        flex: 1;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        line-height: 1.5;
        max-height: 180px;
        padding: 4px 0;
      }

      textarea::placeholder { color: #5f677c; }

      #send {
        border: 0;
        border-radius: 11px;
        background: var(--accent);
        color: #0a0d18;
        font-weight: 600;
        font-size: 13px;
        padding: 9px 16px;
        transition: 120ms ease;
      }

      #send:disabled {
        background: #2a3147;
        color: #6b748c;
        cursor: default;
      }

      .hint {
        margin-top: 8px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: #5f677c;
        text-align: center;
      }

      @media (max-width: 560px) {
        header { padding: 14px 14px 6px; }
        main, footer { padding-left: 14px; padding-right: 14px; }
        .brand small { display: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">minimi <small>chat agent · one tool</small></div>
      <div class="meta">
        <span class="pill" id="mode">echo</span>
        <span id="session-label">session</span>
        <button id="new-session" type="button">New session</button>
      </div>
    </header>

    <main id="chat">
      <div class="empty" id="empty">
        <h1>Temporal recall, first.</h1>
        <p>Ask something, then come back and ask what changed.</p>
        <p><code>“What did I ask you on 3 November? Is your answer still correct today?”</code></p>
      </div>
      <div id="messages"></div>
    </main>

    <footer>
      <form id="composer">
        <textarea
          id="input"
          rows="1"
          maxlength="8000"
          placeholder="Ask something…"
          autocomplete="off"
          aria-label="Message"
        ></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <div class="hint">Enter to send · Shift + Enter for a newline · Phase 0: echo mode</div>
    </footer>

    <script>
      (() => {
        const STORAGE_KEY = 'minimi.sessionId';
        const messagesEl = document.getElementById('messages');
        const emptyEl = document.getElementById('empty');
        const inputEl = document.getElementById('input');
        const formEl = document.getElementById('composer');
        const sendEl = document.getElementById('send');
        const sessionLabelEl = document.getElementById('session-label');
        const newSessionEl = document.getElementById('new-session');

        let streaming = false;

        function newSessionId() {
          return crypto.randomUUID();
        }

        function getSessionId() {
          let id = localStorage.getItem(STORAGE_KEY);
          if (!id) {
            id = newSessionId();
            localStorage.setItem(STORAGE_KEY, id);
          }
          return id;
        }

        function labelSession() {
          sessionLabelEl.textContent = getSessionId().slice(0, 8);
          sessionLabelEl.title = getSessionId();
        }

        function scrollToBottom() {
          const distance =
            document.documentElement.scrollHeight - window.scrollY - window.innerHeight;
          if (distance < 240) {
            window.scrollTo({ top: document.documentElement.scrollHeight });
          }
        }

        function addRow(role, text) {
          emptyEl.hidden = true;

          const row = document.createElement('div');
          row.className = 'row ' + role;

          const bubble = document.createElement('div');
          bubble.className = 'bubble';

          const who = document.createElement('div');
          who.className = 'who';
          who.textContent = role === 'user' ? 'you' : 'minimi';

          const body = document.createElement('div');
          body.className = 'body';
          body.textContent = text || '';

          bubble.append(who, body);
          row.append(bubble);
          messagesEl.append(row);
          scrollToBottom();

          return { row, bubble, body };
        }

        function setStreaming(value) {
          streaming = value;
          sendEl.disabled = value;
          inputEl.disabled = value;
          sendEl.textContent = value ? '…' : 'Send';
        }

        function autoGrow() {
          inputEl.style.height = 'auto';
          inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
        }

        async function readSse(response, onEvent) {
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });

            let boundary;
            while ((boundary = buffer.indexOf('\n\n')) !== -1) {
              const frame = buffer.slice(0, boundary);
              buffer = buffer.slice(boundary + 2);

              for (const line of frame.split('\n')) {
                if (!line.startsWith('data:')) continue;
                const payload = line.slice(5).trim();
                if (!payload) continue;
                try {
                  onEvent(JSON.parse(payload));
                } catch {
                  /* ignore malformed frame */
                }
              }
            }
          }
        }

        async function send(text) {
          const sessionId = getSessionId();
          addRow('user', text);
          const target = addRow('assistant', '');

          const status = document.createElement('div');
          status.className = 'status';
          status.textContent = 'connected';
          target.bubble.append(status);

          const cursor = document.createElement('span');
          cursor.className = 'cursor';

          let received = false;
          setStreaming(true);

          try {
            const response = await fetch('/chat', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                sessionId,
                message: text,
                userTz: Intl.DateTimeFormat().resolvedOptions().timeZone,
              }),
            });

            if (!response.ok) {
              const detail = await response.json().catch(() => ({}));
              throw new Error(
                detail.error ? JSON.stringify(detail) : 'Request failed (' + response.status + ')',
              );
            }

            await readSse(response, (event) => {
              if (event.type === 'status') {
                status.textContent = event.text;
              } else if (event.type === 'token') {
                if (!received) {
                  received = true;
                  status.remove();
                  target.body.append(cursor);
                }
                target.body.insertBefore(
                  document.createTextNode(event.text),
                  cursor,
                );
                scrollToBottom();
              } else if (event.type === 'error') {
                throw new Error(event.message);
              } else if (event.type === 'done') {
                status.remove();
                cursor.remove();
              }
            });
          } catch (error) {
            status.remove();
            cursor.remove();
            target.bubble.classList.add('error');
            const message = error instanceof Error ? error.message : String(error);
            if (!received) target.body.textContent = 'Error: ' + message;
            else target.body.append(document.createTextNode('\n\n[stopped: ' + message + ']'));
          } finally {
            cursor.remove();
            status.remove();
            setStreaming(false);
            inputEl.focus();
          }
        }

        formEl.addEventListener('submit', (event) => {
          event.preventDefault();
          if (streaming) return;
          const text = inputEl.value.trim();
          if (!text) return;
          inputEl.value = '';
          autoGrow();
          void send(text);
        });

        inputEl.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            formEl.requestSubmit();
          }
        });

        inputEl.addEventListener('input', autoGrow);

        newSessionEl.addEventListener('click', () => {
          if (streaming) return;
          localStorage.setItem(STORAGE_KEY, newSessionId());
          messagesEl.replaceChildren();
          emptyEl.hidden = false;
          labelSession();
          inputEl.focus();
        });

        labelSession();
        inputEl.focus();
      })();
    </script>
  </body>
</html>
